name: Deploy dashboard

# 看板默认由本地 deploy_pages.bat 手动发布（Cloudflare 凭据在本机环境变量中）。
# 这里只保留手动触发：需要时在 Actions 页面运行，届时须先在仓库 Secrets 配置
# CLOUDFLARE_ACCOUNT_ID、CLOUDFLARE_API_TOKEN 和 R2_BUCKET。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AGENT_RUNTIME_DIR: ${{ github.workspace }}/runtime
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_RUNTIME_PREFIX: aigc-competitor-agent/runtime
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # 构建器本身只用标准库；httpx 仅供 R2 拉取 runtime 使用。
      - name: Install sync dependency
        run: python -m pip install "httpx==0.28.1"

      # 站点要展示 Agent 的真实产出，而不是仓库里的演示数据。R2 未配置时
      # 退回演示数据继续发布，不让部署整体失败。
      - name: Restore runtime from R2
        continue-on-error: true
        run: python r2_runtime_sync.py pull

      - name: Build static site
        run: python tools/build_static_site.py

      # 契约测试会临时用哨兵数据重建 dist 再还原；因此放在最终构建之前跑，
      # 确保发布出去的一定是这一步之后的权威产物。
      - name: Verify build contract
        run: python -m unittest tests.test_static_site_build -v

      - name: Rebuild authoritative dist
        run: python tools/build_static_site.py

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name aigc-intel-hub --branch=main
